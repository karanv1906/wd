<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f8f8f8;
        }
        .product-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            width: 250px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .product-card:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }
        .product-image {
            width: 100%;
            border-radius: 10px;
        }
        .product-title {
            font-size: 1.5em;
            font-weight: bold;
            margin: 10px 0;
        }
        .product-description {
            font-size: 1em;
            color: #555;
            text-align: center;
            margin-bottom: 10px;
        }
        .product-price {
            font-size: 1.2em;
            font-weight: bold;
            color: #e67e22;
        }
    </style>
</head>
<body>
    <div class="product-card">
        <img src="/assignment13/download.jpg" alt="Product Image" class="product-image">
        <div class="product-title">Product Name</div>
        <div class="product-description">This is a great product that you will love.</div>
        <div class="product-price">$99.99</div>
    </div>
</body>
</html>
