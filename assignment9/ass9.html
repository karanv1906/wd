<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .containee {
            background: white;
            padding: 20px;
            border-radius: 8px;
            width: 300px;
        }
        h2{
            text-align: center;
            margin-bottom: 20px;

        }

        form{
            display: flex;
            flex-direction: column;

        }
        label{
            margin-bottom: 5px;
            font-weight: bold;
        }
        input,textarea{
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            width: 100%;
        }
        button{
            background-color: #007BFF;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;

        }
        button:hover{
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">

        <h2>contact us</h2>
        <form action="">
            <label for="name">name:</label>
            <input type="text"
            id="name" name="name" required>
            <label for="email">email</label>
            <input type="email"
            id="email" name="email" required>
            <label for="message">message</label>
            <textarea name="message" id="message" rows="4" required></textarea>

            <button type="submit" >
        send
            </button>
        </form>
    </div>
    
</body>
</html>
