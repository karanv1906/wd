<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>


#btn {
    padding: 10px 20px;
    font-size: 16px;
    border: none;
    cursor: pointer;
    color: white;
    
    
  }
  .btn1 button{
    background-color: rgb(91, 9, 243);
    padding: 8px;
  
    border-radius: 10px;
    box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.3);
    
    
    
  }
  .btn2 button{
    background-color: aqua;
    padding: 8px;
    border-radius: 10px;
    box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.3);
  }
  .btn3 button{
    background-color: rgb(252, 6, 6);
    padding: 8px;
    border-radius: 10px;
    box-shadow: 4px 4px 10px rgba(6, 238, 45, 0.3);

    
  }
  .btn1 :hover{
    background-color: aliceblue;
    transition: 0.3s;
  }
  .btn2 :hover{
    background-color: aliceblue;
    transition: 0.3s;
  }
  .btn3 :hover{
    background-color: aliceblue;
    transition: 0.3s;
  }

    </style>
</head>
<body>
    <div class="container">

        <div  id="btn" class="btn1">
        <button>PRIMARY</button>
    </div>
    <div id="btn" class="btn2">
        <button>SECONDRY</button>
    </div>
    <div id="btn" class="btn3">
        <button>DANGER</button>
    </div>
    </div>
    
</body>
</html>
