<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{

            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: black;
        }

        .gallery{
            display: grid;
            grid-template-columns: repeat(3,1fr);
            grid-template-rows: repeat(2,auto);
            gap: 10px;
            max-width: 90%;

        }
        .gallery img{
            width: 100%;
            height: auto;
            border-radius: 5px;
        
        }

    </style>
</head>
<body>
    <div class="gallery">
        <img src="/assignment6/img-1.webp" alt="img-1">
        <img src="/assignment6/img-2.jpg" alt="img-2">
        <img src="/assignment6/img-3.png" alt="img-3">
        <img src="/assignment6/img-4.webp" alt="img-4">
        <img src="/assignment6/img-5.jpg" alt="img-5">
        <img src="/assignment6/img-6.jpg" alt="img-6">

    </div>
    
</body>
</html>
