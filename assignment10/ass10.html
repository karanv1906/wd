<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo Classes and Elements</title>
    <style>
        /* Styling for links */
        a {
            color: blue;
            text-decoration: none;
        }
        a:visited {
            color: purple;
        }
        a:hover {
            color: red;
            text-decoration: underline;
        }
        a:active {
            color: green;
        }

        /* Styling for paragraph first line */
        p::first-line {
            font-weight: bold;
            color: darkblue;
        }

        /* Decorative ::before element for heading */
        h1::before {
            content: "★ ";
            color: gold;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <h1>Welcome to My Styled Page</h1>
    <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Nullam efficitur, nunc in hendrerit facilisis, justo quam scelerisque arcu, eget lacinia libero tortor sit amet justo.</p>
    
    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">Contact</a></li>
    </ul>
</body>
</html>
