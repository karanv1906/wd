<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Layout</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-wrap: wrap;
        }
        .container {
            display: flex;
            width: 100%;
        }
        .main {
            flex: 3;
            padding: 20px;
            background-color: #f4f4f4;
        }
        .sidebar {
            flex: 1;
            padding: 20px;
            background-color: #ddd;
        }
        @media screen and (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .sidebar {
                order: 2;
            }
            .main {
                order: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main">
            <h1>Main Content</h1>
            <p>This is the main content area.</p>
        </div>
        <div class="sidebar">
            <h2>Sidebar</h2>
            <p>This is the sidebar content.</p>
        </div>
    </div>
</body>
</html>
