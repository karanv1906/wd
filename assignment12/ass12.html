<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Box</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f4;
            overflow: hidden;
        }
        .box {
            width: 100px;
            height: 100px;
            background-color: red;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            animation: moveBox 5s linear infinite;
        }
        
        @keyframes moveBox {
            0% { left: 0; background-color: red; }
            50% { left: 50%; background-color: blue; }
            100% { left: 100%; background-color: green; }
        }
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
